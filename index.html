<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    
    <!-- Header -->
    <header class="header">
      <h1>🚀 To-Do List</h1>
      <p class="subtitle">Stay organized & productive</p>
    </header>

    <!-- Main Content -->
    <main class="main">
      
      <!-- Form Section -->
      <section class="form-section">
        <form id="todo-form">
          <input type="text" id="todo-input" placeholder="Enter your task..." required>
          <input type="date" id="todo-date" required>
          <button type="submit">➕ Add</button>
        </form>
      </section>

      <!-- Filter Section -->
      <section class="filter-section">
        <input type="text" id="filter-input" placeholder="🔍 Search task...">
      </section>

      <!-- Action Buttons -->
      <section class="actions">
        <button id="delete-all" class="danger-btn">🗑️ Delete All Tasks</button>
      </section>

      <!-- Todo List Section -->
      <section class="content">
        <ul id="todo-list"></ul>
      </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <p id="task-count">Total Tasks: 0 | Completed: 0</p>
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </footer>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
